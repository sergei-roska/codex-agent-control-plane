<!-- M2: Direct Ticket Detail Modal (/tickets/:id) -->
<div class="modal-backdrop" id="modal-ticket-record">
  <div class="modal-box large" role="dialog" aria-modal="true" aria-labelledby="tr-title">
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 12px; min-width: 0; flex-wrap: wrap;">
        <span class="modal-title" id="tr-title">Ticket</span>
        <span class="badge" id="tr-status-badge"></span>
        <span class="badge" id="tr-revision-badge"></span>
      </div>
      <button type="button" class="modal-close-btn" id="btn-ticket-record-close" aria-label="Close">x</button>
    </div>
    <div class="modal-body">
      <div id="tr-note" class="detail-note" role="status"></div>
      <div id="tr-old-banner" class="tf-banner" style="display: none;">
        <span id="tr-old-text"></span>
        <button type="button" class="btn btn-secondary" id="tr-back-current">Back to current revision</button>
      </div>
      <div class="detail-section tr-run" id="tr-run-section" hidden>
        <div class="detail-label">Run</div>
        <div id="tr-run-head"></div>
        <div id="tr-run-decisions"></div>
        <div class="sub-tabs" id="tr-run-tabs" role="tablist" aria-label="Run details"></div>
        <div id="tr-run-panel" class="tr-run-panel" role="tabpanel"></div>
      </div>
      <div class="modal-detail-grid">
        <div class="detail-main">
          <h4 id="tr-ticket-title" style="margin-bottom: 10px; font-size: 15px;"></h4>
          <div class="detail-section">
            <div class="detail-label">Description</div>
            <div id="tr-description" class="detail-block detail-pre"></div>
          </div>
          <div class="detail-section">
            <div class="detail-label">Acceptance criteria</div>
            <div id="tr-criteria" class="detail-block"></div>
          </div>
          <div class="detail-section">
            <div class="detail-label">References (saved, not retrieved)</div>
            <div id="tr-references" class="detail-block"></div>
          </div>
          <div class="detail-section" id="tr-source-section" hidden>
            <div class="detail-label">Retrieved Jira / Confluence context</div>
            <div id="tr-source-summary" class="detail-block"></div>
            <div class="tr-actions" id="tr-source-actions"></div>
            <div id="tr-source-message" class="detail-note" role="status" aria-live="polite"></div>
            <div id="tr-source-history" class="detail-block"></div>
            <div id="tr-source-snapshot" class="detail-block"></div>
          </div>
          <div class="detail-section">
            <div class="detail-label">Attachments</div>
            <div id="tr-attachments" class="detail-block"></div>
          </div>
          <div class="detail-section">
            <div class="detail-label">Events</div>
            <div id="tr-events" class="detail-block event-timeline"></div>
          </div>
        </div>
        <div class="detail-side">
          <div><strong>Source:</strong> <span id="tr-source-kind">Direct request</span></div>
          <div><strong>Tracking:</strong> <span id="tr-source-tracking">internal</span></div>
          <div><strong>Priority:</strong> <span id="tr-priority"></span></div>
          <div><strong>Requested specialty:</strong> <span id="tr-specialty"></span></div>
          <div><strong>Ticket version:</strong> <span id="tr-version"></span></div>
          <div><strong>Revision created:</strong> <span id="tr-rev-created" style="color: var(--text-muted);"></span></div>
          <div><strong>Ticket created:</strong> <span id="tr-created" style="color: var(--text-muted);"></span></div>
          <div><strong>Updated:</strong> <span id="tr-updated" style="color: var(--text-muted);"></span></div>
          <div class="detail-label" style="margin: 6px 0 0;">Revision history</div>
          <div id="tr-revisions" class="tr-revisions"></div>
        </div>
      </div>
      <div class="detail-section">
        <div class="detail-label">Actions</div>
        <div id="tr-actions" class="tr-actions"></div>
        <div id="tr-action-error" class="tf-field-error" role="alert"></div>
      </div>
    </div>
  </div>
</div>
