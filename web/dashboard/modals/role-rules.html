<!-- PC-1: Project rules for one role (/settings/roles/:id/rules) -->
<div class="modal-backdrop" id="modal-role-rules">
  <div class="modal-box large rr-box" role="dialog" aria-modal="true" aria-labelledby="rr-title">
    <div class="modal-header">
      <span class="modal-title" id="rr-title">Project rules</span>
      <button type="button" class="modal-close-btn" id="btn-rr-close" aria-label="Close">x</button>
    </div>
    <div class="modal-body">
      <p class="detail-note rr-note">Added rules are guidance for this role in this project. They never grant tools, access, credentials or permissions, and they apply to new runs only; running work keeps its pinned rules.</p>
      <div id="rr-status" class="rr-status" role="status" aria-live="polite"></div>
      <div id="rr-load"></div>
      <div id="rr-content" hidden>
        <div class="detail-label">Existing rules</div>
        <div id="rr-list" class="rr-list"></div>
        <div class="rr-add">
          <label class="detail-label" for="rr-new-text">New rule</label>
          <textarea id="rr-new-text" class="form-textarea" rows="4" aria-describedby="rr-counter rr-field-error"></textarea>
          <div class="rr-add-row">
            <span id="rr-counter" class="rr-counter"></span>
            <button type="button" class="btn btn-primary" id="btn-rr-add">Add rule</button>
          </div>
          <div id="rr-field-error" class="tf-field-error" role="alert"></div>
        </div>
        <div class="rr-history-block">
          <button type="button" class="btn btn-secondary" id="btn-rr-history" aria-expanded="false" aria-controls="rr-history">History</button>
          <div id="rr-history" class="rr-history" hidden></div>
        </div>
      </div>
    </div>
  </div>
</div>
