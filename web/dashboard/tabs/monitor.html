<section id="tab-monitor" class="tab-pane">
  <div class="monitor-container">
    <div class="monitor-controls">
      <select id="monitor-type-filter" class="select-input" disabled>
        <option value="all">All categories</option>
      </select>
      <select id="monitor-role-filter" class="select-input" disabled>
        <option value="all">Role filter unavailable</option>
      </select>
      <select id="monitor-level-filter" class="select-input" disabled>
        <option value="all">Severity unavailable</option>
      </select>
      <button class="btn btn-secondary" id="btn-clear-logs" style="margin-left: auto;">Clear Log</button>
    </div>
    <div id="monitor-status" class="detail-empty" role="status"></div>
    <div class="console-log" id="monitor-logs">
      <!-- Injected via JS -->
    </div>
  </div>
</section>
