test_module.test_route:
  path: '/test-module/hello'
  defaults:
    _controller: 'Drupal\test_module\Controller\TestController::hello'
    _title: 'Hello Test'
  requirements:
    _permission: 'access content'

test_module.test_form_route:
  path: '/test-module/form'
  defaults:
    _form: 'Drupal\test_module\Form\TestForm'
    _title: 'Test Form'
  requirements:
    _permission: 'access content'
